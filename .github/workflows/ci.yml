name: CI

# Pushes are watched on `main` only. This fired on every branch through 0.5, because that work happened
# on long-lived branches (`enricher-0.5`) merged wholesale rather than PR'd a commit at a time, and CI
# watching `main` alone would have spoken up only after the merge it was meant to gate. With 0.5
# released that shape is gone, and the full matrix on every push to every branch mostly spends minutes
# on work in progress. Branch work is still gated: `pull_request` runs the same three jobs before a
# merge can land, and `workflow_dispatch` covers checking a branch without opening a PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to the exact release, not a floating `@v9`: astral-sh stopped publishing major-version
      # tags after `v7`, so `setup-uv@v8`/`@v9` resolve against nothing and every job dies in "Set up
      # job" before a single test runs. Bump this to the next `vX.Y.Z` deliberately.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # `--locked` fails when uv.lock does not match pyproject.toml, which makes a forgotten `uv lock`
      # a CI failure rather than a difference between two developers' environments.
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor every member declares (`requires-python = ">=3.13"`) and the version actually
        # developed against. Both, because a floor nobody runs is a claim rather than a guarantee.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0   # exact release — see the lint job
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked

      # No JUST_DNA_NETWORK_TESTS and no snapshot caches, so the live-API tests and the resolver
      # integration tests skip. That is intended: this job must be able to pass with no network and no
      # credentials. `HF_TOKEN` is deliberately absent — nothing here should need one, and a job that
      # required a secret could not run on a fork.
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage — Python ${{ matrix.python-version }}"
            echo
            uv run coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
