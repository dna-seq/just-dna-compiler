name: CI

# Runs on every branch, because the work here happens on long-lived branches (`enricher-0.5`) that are
# merged rather than PR'd one commit at a time — CI that only watched `main` would first speak up after
# the merge it was meant to gate.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      # `--locked` fails when uv.lock does not match pyproject.toml, which makes a forgotten `uv lock`
      # a CI failure rather than a difference between two developers' environments.
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor every member declares (`requires-python = ">=3.13"`) and the version actually
        # developed against. Both, because a floor nobody runs is a claim rather than a guarantee.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked

      # No JUST_DNA_NETWORK_TESTS and no snapshot caches, so the live-API tests and the resolver
      # integration tests skip. That is intended: this job must be able to pass with no network and no
      # credentials. `HF_TOKEN` is deliberately absent — nothing here should need one, and a job that
      # required a secret could not run on a fork.
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage — Python ${{ matrix.python-version }}"
            echo
            uv run coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
