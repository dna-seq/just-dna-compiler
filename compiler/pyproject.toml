[project]
name = "just-dna-compiler"
version = "0.9.0"
description = "Reference compiler for just-dna annotation modules: spec directory → parquet artifact + manifest"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Newton Winter", email = "isoutthere@gmail.com" },
]
maintainers = [
    { name = "Newton Winter", email = "isoutthere@gmail.com" },
]
# Pure-Python transform tier: no duckdb, no network, no deployment/location deps. Resolution is
# consumed from an injected resolution.csv; the DuckDB reference path moved to just-dna-enricher (the
# deprecated ensembl_cache surface routes there via a guarded optional import, retired at 1.0).
dependencies = [
    "just-dna-format>=0.9.0",
    "polars>=1.42.0",
    "pyyaml>=6.0.2",
    "typer>=0.12.0",
]

[project.optional-dependencies]
# A host whose CPU lacks the features polars' default runtime is built for (a server without AVX-512 or
# AVX2) installs `just-dna-compiler[compat]`: `polars[rtcompat]` adds `polars-runtime-compat`, and polars
# loads that runtime first whenever it is installed (`polars._plr`'s preference order). The floor is the
# core `polars` floor above, one number written twice; `test_compat_extra.py` holds them equal.
compat = ["polars[rtcompat]>=1.42.0"]

[project.scripts]
just-dna-compiler = "just_dna_compiler.cli:app"

[build-system]
requires = ["uv-build<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
just-dna-format = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
