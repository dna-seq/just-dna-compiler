[project]
name = "just-dna-enricher"
version = "0.7.0"
description = "Network tier for just-dna: fills the source-independent resolution table (cache + Ensembl) that the compiler consumes"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Newton Winter", email = "isoutthere@gmail.com" },
]
maintainers = [
    { name = "Newton Winter", email = "isoutthere@gmail.com" },
]
# The network tier. It DEPENDS on format + compiler (it orchestrates them); the arrow never points
# back, so `import httpx` / `huggingface_hub` never enters the compile path (CONSTITUTION Goal 2 +
# the 0.5 amendment scoping the network tier + HuggingFace here). This is the only package allowed to
# fetch; format and compiler stay strictly inject-only.
dependencies = [
    "just-dna-format>=0.7.0",
    "just-dna-compiler>=0.7.0",
    "duckdb>=1.1.0",
    "platformdirs>=4.0.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "tenacity>=9.0.0",
    "huggingface-hub>=0.34.0",
    "typer>=0.12.0",
    # GA4GH VRS allele identity. CORE, not an extra: minting a *substitution* id is stdlib and lives
    # in the format tier, but justifying an **indel** needs the reference sequence — and reading
    # sequence is network access, which is precisely this tier's job. Probed rather than assumed: the
    # plan budgeted for `ga4gh.vrs[extras]` (seqrepo + pysam + hgvs, a compiled extension and a
    # multi-GB local sequence store) on the belief that a local seqrepo was required. It is not. Core
    # `ga4gh.vrs` with the seqrepo **REST** data proxy normalizes indels over HTTP, and costs 14
    # pure-Python packages with no compiled dependencies (pydantic is already ours). At that price
    # there is no reason to make complete allele identity opt-in, so it is the default and `--offline`
    # is the only mode that degrades to substitutions-only.
    "ga4gh.vrs>=2.3.3",
]

[project.scripts]
just-dna-enricher = "just_dna_enricher.cli:app"

[project.optional-dependencies]
# The AlphaGenome Atlas, on two packages (RM192). `grpcio` + `protobuf` reach **every** Atlas RPC:
# the score fields are plain `bytes` that `struct.unpack` decodes, and the request filter is an
# AIP-160 string. Measured on 2026-09-10 in a clean venv: `uv pip install grpcio protobuf` is
# **19 MB of site-packages and +2 packages** on this tier (grpcio 1.83.1, protobuf 7.36.1;
# typing-extensions comes with it but pydantic already requires it). Against **255 MB and 81
# packages** for `uv add alphagenome`, whose wheel declares anndata, pandas, scipy, zarr, h5py,
# numcodecs, pyarrow, matplotlib, seaborn, pyfaidx, absl-py and fsspec flat — six of them never
# imported on any scoring path, and `atlas.py` importing `anndata` at module level so even the
# SDK's own import path costs 242 MB (ALPHAGENOME_ATLAS.md § 6.2, which measured 22 MB at the
# grpcio release current then).
#
# The `.proto` sources are Apache-2.0 and reached by a **pin** — a commit id plus a sha256 per file
# in `atlas_protos.py`, fetched by `hatch_build.py` at wheel-build time — which is what makes the
# light path **declarable** rather than a `pip install --no-deps` recipe. They were vendored in
# `docs/vendor/alphagenome_protos/` from commit `1f9a84a` until RM196 replaced the copy with the pin,
# because a vendored copy goes stale silently and a digest cannot. This file argued against the light
# path until RM192, and the argument is deleted rather than left standing.
#
# `protobuf` is a **runtime** dependency, not a build one — the generated `_pb2` modules
# `from google.protobuf import descriptor`, so it is imported on every call. Only `grpcio-tools` is
# build-only, and it is in `dev`. Measured, not assumed: the client runs in a venv holding exactly
# `grpcio`, `protobuf` and the generated bindings, with `import alphagenome` raising
# `ModuleNotFoundError`.
#
# An extra rather than core because one gRPC surface does not move the tier's floor. If a second
# arrives, this moves to `dependencies` and nothing else changes.
atlas = [
    "grpcio>=1.68.0",
    "protobuf>=5.29.0",
]
# Publisher / developer surface. huggingface-hub and ga4gh.vrs are already core deps (snapshot
# download; allele identity); this extra marks the upload CLI (`just-dna-enricher upload`), the
# ClinVar and gnomAD-constraint reference builders (`just-dna-enricher clinvar build`,
# `just-dna-enricher gnomad constraint build`, which need polars to write the snapshot parquet) and
# test tooling as the supported install path for authors — `pip install just-dna-enricher[dev]`.
# polars is a builder-only dep (guarded import in `clinvar_build`/`constraint_build`); the runtime
# resolver path stays polars-free (the compiler tier owns polars, CONSTITUTION Goal 2).
dev = [
    "pytest>=9.0.3",
    "polars>=1.42.0",
    # Build-time only, and the reason it is here rather than in `atlas`: protoc generates the Atlas
    # bindings, and the runtime imports them without it (RM192). The suite needs it because
    # `test_bindings_regenerate_from_the_vendored_sources` regenerates into a scratch directory —
    # which is what keeps "the repository carries reproducible sources" a checked property.
    "grpcio-tools>=1.68.0",
    # Builder-only, for `just-dna-enricher acmg build`: ACMG publishes the SF v3.3 list as a
    # supplementary **workbook**, and the page NCBI serves is a release behind it. The runtime check
    # reads the built CSV snapshot with the standard library, so this never enters a check's install.
    "openpyxl>=3.1.5",
]

# **hatchling for this package only** (RM196). `uv_build` has no build hook, and the Atlas bindings
# have to be generated at build time with upstream's proto imports rewritten — see
# `enricher/hatch_build.py` for why no off-the-shelf plugin does that. Backends are declared per
# package, so `just-dna-format` and `just-dna-compiler` stay on `uv_build`; the blast radius is the
# one tier that runs `protoc`.
[build-system]
requires = ["hatchling", "grpcio-tools>=1.68.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/just_dna_enricher"]

# The fetched sources are git-ignored and deliberately NOT build-ignored: the repository carries a
# pin, the distribution carries the files. `hatch_build.py` force-includes them and the generated
# tree, since hatchling honours .gitignore by default.
[tool.hatch.build.targets.sdist]
include = ["src/just_dna_enricher", "hatch_build.py", "README.md"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
just-dna-format = { workspace = true }
just-dna-compiler = { workspace = true }

[dependency-groups]
dev = [
    "just-dna-enricher[dev]",
    # The Atlas tests moved into `testpaths` with RM192, so a developer install has to carry the
    # extra or `uv run pytest` collects them into a `ModuleNotFoundError: grpc`. This is what makes
    # the extra optional for a *consumer* and mandatory for the suite.
    "just-dna-enricher[atlas]",
]
