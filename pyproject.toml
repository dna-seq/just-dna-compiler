[tool.uv.workspace]
members = ["schema", "compiler", "enricher"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]
# Not in `default-groups`, so `uv sync` stays the lean install every contributor and the test matrix
# runs; the site is built with `uv run --group docs properdocs build -f mkdocs.yml`. CI syncs it in its
# own job.
#
# **Material for MkDocs rather than Jekyll**, and the reason is the workspace: a docs toolchain that is
# a uv dependency group is installed by the same `uv sync --locked` that gates everything else, so a
# docs build cannot pass locally and fail in CI over a Gemfile nobody locked. It also renders `docs/`
# **in place** — every file stays at the path `CLAUDE.md`, `test_doc_links.py` and the `.claude/` tools
# key on.
#
# **Material entered maintenance mode in early 2026**; new feature work is in Zensical, from the same
# author, which reads `mkdocs.yml` natively. That is why the configuration is `mkdocs.yml` and not
# `zensical.toml`: the migration is then a change of build command, not of the site.
#
# **What actually blocks that switch was measured on 2026-09-12, and it is not `mkdocstrings`.** A
# Zensical 0.0.61 build of this exact config, in a scratch copy, rendered all 60 real `docs/` pages,
# reported the same single anchor issue with a better diagnostic, and **`mkdocstrings` worked** — a
# `::: just_dna_format.identity` page came out with its signatures. (It is also about three times
# faster, which is **not** a reason for anything: a docs site is built by CI and occasionally by hand,
# so seconds per build decide nothing. Recorded only so the next reader does not mistake it for a
# finding.) What
# did not run is **`mkdocs-gen-files`**: Zensical validates that the plugin is installed and then
# ignores it, so the home page and all 119 API pages were absent with no warning. A silent no-op, which
# is worse than a refusal. Re-run that probe rather than re-reasoning about it; the entry under
# `@a-docs-site-nav-is-a-registry-over-a-directory-that-grows` in docs/AGENT_NOTES.md has the method and
# the pass criterion.
docs = [
    # **The build is driven by ProperDocs, not by `mkdocs`, and the reason is in the lock file rather
    # than in anyone's opinion.** MkDocs 1.x upstream is unmaintained; the announced 2.0 removes the
    # plugin system and the theming system with no migration path, which takes out all four plugins
    # below. ProperDocs is a 1.x continuation by a former MkDocs maintainer, a drop-in over the same
    # `mkdocs.yml`. It is declared here because it is already **transitively required**:
    # `mkdocs-gen-files` and `mkdocs-literate-nav` each list it beside `mkdocs`, so the plugin
    # ecosystem has moved and depending on it by accident is the only alternative to depending on it
    # on purpose. Measured rather than assumed — `properdocs build --strict` renders this site, theme,
    # API reference and all, with no warning of its own.
    "properdocs>=1.6.7",
    # The config file therefore stays `mkdocs.yml`, and every command passes `-f mkdocs.yml`. ProperDocs
    # prefers `properdocs.yml` and says so at `INFO` on the fallback; the explicit flag silences that
    # without closing the other exit, since **Zensical** — the Material team's successor, Material
    # itself having entered maintenance mode in early 2026 — reads `mkdocs.yml` natively and is the
    # likely destination once it runs `mkdocs-gen-files` (see above: everything else already works).
    #
    # **ProperDocs is chosen despite being nearly as static as what it forked, and that is the honest
    # form of the argument.** Measured 2026-09-12: `mkdocs/mkdocs` has had no commit in three months
    # and no release since 1.6.1 in August 2024. ProperDocs has had **one** commit in three months and
    # no release since 1.6.7 in March 2026 — a burst of work in March, then nothing. Zensical had 70
    # commits in the last month and released v0.0.61 the day before this was written, with
    # `mkdocstrings`' own author as its second contributor. So the live project is the one that cannot
    # build this site, and the one that can is frozen. Frozen is acceptable **here** and only here: a
    # docs builder is a pinned tool in a lock file, not a service, it has no attack surface a CI job
    # reaches, and ProperDocs is still strictly ahead of `mkdocs` 1.6.1 by six months of fixes while
    # being the version two of these four plugins actually declare. Its licence is BSD-2-Clause;
    # GitHub reads it as `NOASSERTION` only because the fork added a copyright line to the header.
    #
    # `mkdocs` is still capped below 2.0: `mkdocs-material` and `mkdocstrings` import it regardless of
    # what drives the build, so a 2.0 resolved into this group breaks them whoever is building.
    # `uv.lock` pins today's versions, so the cap is for the *next* `uv lock` — the only place the
    # break can enter.
    "mkdocs<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    # The home page and every API page are written at **build time** into the site, never onto disk:
    # `docs/` root "holds only what is still live" (CLAUDE.md), a rule an `index.md` nobody authored
    # would quietly break, and `test_doc_links.py` walks every tracked markdown file.
    "mkdocs-gen-files>=0.5",
    # Lets that generated API section carry its own nav (`api/SUMMARY.md`) instead of `mkdocs.yml`
    # listing one line per module — 100 modules across three packages, and a hand-kept list loses one.
    "mkdocs-literate-nav>=0.6",
]

[tool.ruff]
# Unconfigured, ruff enables ~826 rules and `ruff check .` reported over a thousand findings — most of
# them one modernization the project had not decided on yet. The point of this section is that the
# declared dev tool states what the project follows, so the count is a gate rather than noise.
#
# Every member pins `requires-python = ">=3.13"`. Saying so here is load-bearing: the rules that offer a
# modern spelling (PEP 604 `X | None`) resolve against the floor, not against whichever interpreter runs.
target-version = "py313"
# Two exclusions, both about files nobody hand-writes as Python.
#
# `generated/` is `protoc` output: formatting it would put a reformat in the diff of every regeneration
# and re-fail the format gate the next time the protos are rebuilt.
#
# Markdown is excluded because `ruff format` reformats fenced Python blocks inside it, and this repo's
# docs are *records*. The first probe run rewrapped quoted snippets in eleven files, nine of them
# archived `Sn` sections that CONSUMER_SUGGESTIONS_HISTORY keeps verbatim, and
# `test_every_archived_section_is_marked_and_matches` failed on it — correctly. A snippet in an answered
# item is evidence about the moment the reply was written, not a sample anyone should run today, so the
# formatter has no standing over it for the same reason it has none over a commit message.
extend-exclude = ["**/generated/**", "**/*.md"]
# Not enforced as a lint (E501 is deliberately unselected) but enforced as formatting: `ruff format
# --check .` runs in CI beside `ruff check .`, so this is the width the tree is actually at rather than
# one it would be at if anyone ran the formatter. It matches the prose-heavy docstrings and long
# diagnostic strings the codebase has. The tree was brought to it in one pass on 2026-09-11; the files
# that moved were written before the width was declared.
line-length = 110

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # pycodestyle, minus the purely-formatting opinions
    "F",                # pyflakes
    "I",                # import order — "absolute imports only" is a house rule; this keeps it stable
    "UP",               # pyupgrade. The floor is 3.13, so the modern spelling is always available
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM", "FURB", "PIE", "FLY",
]
ignore = []

[tool.ruff.lint.flake8-bugbear]
# B008 (a function call in a default argument) is ENFORCED, with the three intended shapes named
# rather than the rule switched off. Typer's entire API is `def cmd(x: T = typer.Option(...))`: the
# call in the default *is* the declaration, and "Typer for every CLI" is a house rule, so there is no
# alternative spelling. `repro_out` is a pure function of a constant that every builder's `--out`
# default goes through, so an AST guard can prove they all land under `data/`. Everything else a
# default calls — a clock, a resolver, a loader — is exactly what the rule exists to catch, and this
# repo has met that shape once already (`@default-arg-before-setup`). It read `ignore = ["B008"]`
# until 2026-09-09, which switched the rule off for those cases too.
extend-immutable-calls = ["typer.Option", "typer.Argument", "just_dna_enricher.locations.repro_out"]

# Deliberately NOT selected, so the reasons are recorded rather than rediscovered:
#   BLE001 — `except Exception` around a network call is this tier's contract, not a swallowed error.
#            Every site logs or records a finding (a failed link degrades to the next one; `--offline`
#            reports `unchecked`). Blanket breadth is correct when the next link must run whatever
#            the cause was.
#   ISC004 — a long diagnostic written as one implicitly-concatenated f-string inside a single-element
#            list is the idiom of every check in `compiler.py`. Consistent and intentional.
#   E501   — see `line-length` above.

[tool.ruff.lint.per-file-ignores]
# A test that asserts a bad row is rejected does not care which exception class carries the rejection —
# the point is that *something* refuses it.
#
# SIM300: ruff reads a CONSTANT_CASE name as the *constant* half of a comparison, so
# `assert LOSSY_OVERLAY_TABLES == {"literature.csv", "resolution.csv"}` reads to it as a Yoda condition
# and it offers to flip the sides. That flip fights the house idiom: a registry guard asserts an equality
# over the *walked set* (`@registry-completeness`), and the registry is the subject under test while the
# literal is the expectation — subject first is the whole point, and three of these arrived in a single
# day's commits, so a per-site noqa would grow one line per guard forever. Tests only: a genuine Yoda
# condition in source is still worth reporting.
"*/tests/*" = ["B017", "SIM300"]

[tool.coverage.run]
# Named here rather than as `--cov=` flags so `uv run pytest --cov` means the same thing locally and in
# CI. Source dirs only — measuring the tests themselves inflates the number with code that is executed
# by definition.
source = [
    "schema/src/just_dna_format",
    "compiler/src/just_dna_compiler",
    "enricher/src/just_dna_enricher",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# **A floor, not a target, and deliberately below the current number.** Measured 86% locally and **85%
# in a CI-shaped run** — CI has no Ensembl/ClinVar cache and no `JUST_DNA_NETWORK_TESTS`, so ten more
# tests skip there and the figure is legitimately lower. A threshold set at the observed value would go
# red the first time a skip count moved. Ratchet it upward when the margin is real, never to chase a
# number: this repo's demonstrated failure mode is a *uniform corpus* (every reference example on one
# build hid four live bugs while every line was covered), which no line-coverage figure can see.
fail_under = 83
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
]

[tool.pytest.ini_options]
testpaths = ["schema/tests", "compiler/tests", "enricher/tests"]
addopts = "-vvv --import-mode=importlib"
markers = [
    "integration: needs external data/network (an Ensembl reference cache or HuggingFace). Set JUST_DNA_ENSEMBL_CACHE to run resolver tests; skipped otherwise.",
]
filterwarnings = [
    # **A deprecation is an error here — but read the next paragraph before trusting it.**
    #
    # Two polars `is_in` deprecations sat in the suite's tail for a release, printed on every run and
    # acted on by nobody, and the thing they warned about was a real ambiguity rather than a style
    # note. A warning that scrolls past gets fixed the day it becomes a breakage, which is the worst
    # day to fix it.
    #
    # **What this catches, measured rather than assumed: Python-level deprecations only.** A
    # `warnings.warn(..., DeprecationWarning)` from stdlib, pydantic, or our own code becomes a test
    # failure — verified with a throwaway test that did exactly that and failed.
    #
    # **What it does NOT catch, and the irony is the point: the polars warnings that motivated it.**
    # polars emits `is_in`'s deprecation from its Rust layer, outside Python's warning-filter
    # machinery: `python -W error::DeprecationWarning -c "...is_in(series)"` prints the warning and
    # exits zero. The category really is `builtins.DeprecationWarning`, so it *looks* filterable and
    # is not. Any library warning raised Rust-side or off the main thread can behave this way, so a
    # clean run is not proof that no deprecation fired — read the summary line too.
    #
    # **The cost is real and accepted:** an upstream release deprecating something we use will fail
    # CI on a change that did not cause it. That is the trade — a red build naming the call site,
    # against a quiet one that keeps working until it suddenly does not.
    #
    # **The escape hatch is an `ignore:` line below with its reason**, which makes silencing one a
    # visible decision rather than a default. Later filters win, so every entry after this narrows it.
    "error::DeprecationWarning",
    # The ensembl_cache/DuckDB path is a deprecated-but-supported surface (removed at 1.0); tests that
    # exercise it deliberately don't need to shout. `test_deprecated_ensembl_cache_path_warns` asserts
    # the warning explicitly (pytest.warns overrides this ignore).
    "ignore:compile_module\\(ensembl_cache:DeprecationWarning",
]
