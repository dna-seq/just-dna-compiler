  title: FMR1 CGG repeat — a threshold that cites the paper it came from
  report_title: FMR1 CGG (fragile X)
  description: The FMR1 CGG tract, binned, with every boundary carrying the PubMed id it was drawn
    from. RM47 made a bin row citable in 0.6 and nothing in the corpus had done it — htt_repeat_expansion
